[package]
name = "autohotkey-ux"
version = "2.0.19"
edition = "2021"
description = "AutoHotkey Dash and tools, rebuilt in Rust for Linux (Arch + KDE Plasma)"
license = "GPL-2.0-or-later"

[[bin]]
name = "autohotkey-ux"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
dirs = "5"
rfd = "0.15"
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
